<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/android-chrome-192x192.png" type="image/x-icon">
    <title>Controle de componentes</title>
</head>
<body>

    <aside class="menu-lateral">
        <img src="img/implante-icon.jpg" alt="Logotipo do estoque de componentes">
        <h1 class="titulo-estoque">Estoque de Componentes</h1>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Componentes</a></li>
            <li><a href="#">Movimentações</a></li>
            <li><a href="#">Relatórios</a></li>
        </ul>   
    </aside>

    <main class="area-principal">
        <div class="card-1">
            <h2>Total de componentes</h2>
            <p>24</p>
            <span>Cadastrados no estoque</span>
        </div>
        <div class="card-2">
            <h2>Em estoque</h2>
            <p>24</p>
            <span>Componentes disponiveis</span>
        </div>
        <div class="card-3">
            <h2>Estoque mínimo</h2>
            <p>24</p>
            <span>Componentes em alerta</span>
        </div>
        <div class="card-4">
            <h2>Total de componentes</h2>
            <p>24</p>
            <span>Componentes esgotados</span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
