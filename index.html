<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/android-chrome-192x192.png" type="image/x-icon">
    <title>Controle de componentes</title>
<script src="https://kit.fontawesome.com/d00c321405.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="layout">
        <aside class="menu-lateral">
            <div class="cabecalho-menu">
                <img src="img/implante-icon-removebg-preview.png" alt="Logotipo do estoque de componentes" class="img-logo">
                <h2 class="titulo-estoque">Estoque de Componentes</h2>
            </div>
            <ul>
                <li class="itens-menu ativo">
                    <i class="fa-solid fa-house"></i>
                    <a href="#">Início</a>
                </li>
                <li class="itens-menu">
                    <i class="fa-solid fa-box"></i>
                    <a href="#">Componentes</a>
                </li>
                <li class="itens-menu">
                    <i class="fa-solid fa-shuffle"></i>
                    <a href="#">Movimentações</a>
                </li>
                <li class="itens-menu">
                    <i class="fa-solid fa-chart-line"></i>
                    <a href="#">Relatórios</a>
                </li>
            </ul>
        </aside>

        <main class="area-principal">
            <div class=" card card-1">
                <i class="fa-solid fa-box-open"></i>
                <div>
                    <h4>Total de componentes</h4>
                    <p>24</p>
                    <span>Cadastrados no estoque</span>
                </div>
            </div>
            <div class="card card-2">
                <i class="fa-solid fa-circle-check"></i>
                <h4>Em estoque</h4>
                <p>24</p>
                <span>Componentes disponiveis</span>
            </div>
            <div class="card card-3">
                <i class="fa-solid fa-triangle-exclamation" style="color: rgb(145, 27, 27);"></i>
                <h4>Estoque mínimo</h4>
                <p>24</p>
                <span>Componentes em alerta</span>
            </div>
            <div class="card card-4">
                <i class="fa-solid fa-circle-exclamation" style="color: rgb(145, 27, 27);"></i>
                <h4>Total de componentes</h4>
                <p>24</p>
                <span>Componentes esgotados</span>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
   
</body>
</html>
